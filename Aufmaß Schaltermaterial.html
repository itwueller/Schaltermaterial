<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Aufmaß Schaltermaterial</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
/* Layout: eine Spalte wie ein Klemmbrett – Kopf, Positionen nach Raum, Materialliste; untere Leiste für die Hauptaktion */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --line:#d9dee6; --fg:#16202c; --muted:#5b6778;
  --accent:#1d5bd6; --accent-ink:#ffffff; --accent-soft:#e3ebfb;
  --copper:#a8541f; --danger:#c0362c; --ok:#2f7d4f;
  --mark:#fff799; --mark-ink:#16202c; --mark-edge:#d9c400;
  --f-head:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151c; --surface:#18202a; --line:#2b3644; --fg:#e7ecf2; --muted:#9aa6b6;
  --accent:#5b8ff0; --accent-ink:#0c1320; --accent-soft:#1d2a40; --copper:#e08a52; --danger:#ff6b5e; --ok:#5cc58a; --mark:#e8d73a; --mark-ink:#16202c; --mark-edge:#fff14d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151c; --surface:#18202a; --line:#2b3644; --fg:#e7ecf2; --muted:#9aa6b6;
  --accent:#5b8ff0; --accent-ink:#0c1320; --accent-soft:#1d2a40; --copper:#e08a52; --danger:#ff6b5e; --ok:#5cc58a; --mark:#e8d73a; --mark-ink:#16202c; --mark-edge:#fff14d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 24px}
.ver{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 110px;text-align:center;font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;border-top:1px solid var(--line)}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:1.7rem}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.small{min-height:36px;padding:0 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:default}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.status{font-size:.8rem;color:var(--muted)}
.status.warn{color:var(--copper)}
.list{display:grid;gap:10px}
.brandbar{background:var(--surface);border-bottom:1px solid var(--line)}
.brand{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.brand img{display:block;height:32px;width:auto;max-width:100%;background:#fff;border-radius:5px;padding:4px 7px;margin-left:-7px}
.search{position:relative;display:block}
label.f{position:relative}
.ac-list{position:absolute;left:0;right:0;top:100%;margin-top:4px;z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(10,20,35,.2);max-height:min(300px,45vh);overflow-y:auto;overscroll-behavior:contain;text-transform:none;letter-spacing:0}
.ac-opt{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 12px;min-height:44px;font-size:1rem;font-weight:400;color:var(--fg)}
.ac-opt:last-child{border-bottom:0}
.ac-opt b{font-weight:700;color:var(--accent)}
.ac-opt:hover,.ac-opt.akt{background:var(--accent-soft)}
.search input{width:100%;min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:1rem;margin-bottom:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.job{display:grid;grid-template-columns:1fr auto;gap:10px 12px;align-items:center;width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.job-open{display:grid;gap:4px;text-align:left;background:none;border:0;padding:0;min-width:0}
.job .t{font-weight:600;font-size:1.05rem;min-width:0;overflow-wrap:anywhere}
.job .s{color:var(--muted);font-size:.88rem;min-width:0;overflow-wrap:anywhere}
.job .c{font-family:var(--f-head);font-size:1.4rem;color:var(--copper);text-align:right;line-height:1}
.job-actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:10px;border-top:1px solid var(--line)}
.job-actions .btn{flex:1;max-width:160px}
.job-side{display:flex;gap:8px;align-items:center}
.sich{margin-top:20px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.sich.alt{border-color:var(--copper);background:color-mix(in srgb,var(--copper) 10%,var(--surface))}
.job-side .btn{min-height:44px}
.confirm-inline b{color:var(--danger);margin-right:auto}
.job .c small{display:block;font-family:var(--f-body);font-size:.7rem;color:var(--muted)}
.empty{padding:28px 20px;border:1.5px dashed var(--line);border-radius:12px;text-align:center;display:grid;gap:12px;justify-items:center}
.tabs{display:flex;gap:4px;padding:4px;background:var(--accent-soft);border-radius:12px;margin:14px 0}
.tabs button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:grid;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
label.f input,label.f textarea,label.f select{text-transform:none;letter-spacing:0;font-size:1rem;font-weight:400;color:var(--fg);min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);width:100%}
label.f textarea{min-height:72px;resize:vertical}
.full{grid-column:1/-1}
.room{margin-top:18px}
.btn.small.ico.stift{padding:0;min-width:28px;width:28px;min-height:28px;height:28px;border-radius:7px}
.roomadd{margin-top:10px;gap:8px}
/* ---------- Handy & iPad ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;box-shadow:0 0 0 6px var(--bg)}
.sheet>.row:first-child{position:sticky;top:-18px;z-index:3;background:var(--bg);margin:-18px 0 -6px;padding:14px 0 8px}
.sheet>.row:last-child:not(:first-child){position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));z-index:3;background:var(--bg);margin:0 0 calc(-18px - env(safe-area-inset-bottom,0px));padding:10px 0 calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
@media (max-width:600px){
  h1{font-size:1.4rem;line-height:1.2}
  .job .t{font-size:1rem}
}
@media (pointer:coarse){
  .btn.small{min-height:42px}
  .btn.small.ico{min-width:42px}
  .btn.small.ico.stift{min-width:32px;width:32px;min-height:32px;height:32px}
  .fgrid button{min-height:48px}
}
@media (min-width:700px){
  .scrim{align-items:center;padding:24px}
  .sheet{border-radius:16px;max-width:680px;max-height:88vh;max-height:88dvh}
  .sheet>.row:last-child:not(:first-child){bottom:-18px;margin-bottom:-18px;padding-bottom:14px}
  .fgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
}
@media (min-width:900px){
  .wrap,.ver,.brand{max-width:1120px}
  .bar .btn{max-width:300px}
  .list{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .raeume{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 28px;align-items:start}
  .raeume>.room{margin-top:18px}
  .fields{grid-template-columns:repeat(3,minmax(0,1fr))}
  .sich{max-width:640px}
  #app>.mkinfo,#app .mat{max-width:900px}
  h1{font-size:1.9rem}
}
.room,.etage,.pos{border-radius:10px}
.blink{animation:blink 1.5s ease-out}
@keyframes blink{0%,25%{background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent)}100%{background:transparent;box-shadow:0 0 0 3px transparent}}
.etage.blink{animation-name:blinkEt}
@keyframes blinkEt{0%,25%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 3px transparent}}
@media (prefers-reduced-motion:reduce){.blink,.etage.blink{animation-duration:.01s}}
.etage{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:26px;padding:8px 12px;background:var(--accent-soft);border-radius:10px}
.etage h2{color:var(--fg)}
.inet{margin-left:12px}
label.f select{appearance:auto}
.room-h h3{font-size:1.2rem}
.room-n{display:flex;align-items:center;gap:8px;min-width:0}
.room-n h2{min-width:0;overflow-wrap:anywhere}
.room-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-bottom:6px;border-bottom:2px solid var(--fg);margin-bottom:8px}
.pos{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn.ico{min-width:40px;padding:0;font-size:1.05rem}
.chip.zus{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
@media (max-width:640px){.pos{grid-template-columns:auto 1fr}.acts{grid-column:1/-1}}
.pos .q{font-family:var(--f-head);font-size:1.3rem;min-width:2.4ch;text-align:right;color:var(--copper)}
.pos .d{min-width:0}
.pos .d b{display:block;font-weight:600}
.pos .d span{font-size:.88rem;color:var(--muted)}
.chip{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin-right:6px;vertical-align:1px}
.chip.ap{background:color-mix(in srgb,var(--copper) 16%,transparent);color:var(--copper)}
.mat{width:100%;border-collapse:collapse}
.mat td,.mat th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.mat th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.mat td.n{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;width:4.5em}
.mat tr.mk td:not(:first-child){background:var(--mark);color:var(--mark-ink)}
.mat td:first-child{width:52px;padding-right:0}
.mkbtn{width:40px;height:40px;border-radius:8px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:1.1rem;color:var(--mark-ink);display:grid;place-items:center}
.mkbtn[aria-pressed="true"]{background:var(--mark);border-color:var(--mark-edge)}
.mkinfo{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:.92rem}
.mat tr.grp td{border-bottom:2px solid var(--fg);font-family:var(--f-head);font-size:1.05rem;padding-top:18px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;justify-content:center;z-index:5}
.bar .btn{flex:1 1 0;min-width:0;max-width:360px;padding:0 8px;line-height:1.15;text-align:center}
@media (max-width:480px){.bar{gap:6px}.bar .btn{font-size:.9rem}}
/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:44px;min-width:52px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.slots{display:grid;gap:10px}
.slot{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px}
.slot .sl{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.fgrid button{min-height:44px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:.88rem;text-align:left;line-height:1.2}
.fgrid button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.preview{display:flex;gap:4px;justify-content:center;padding:6px 0}
.preview .m{width:54px;height:54px;border:2px solid var(--fg);border-radius:8px;display:grid;place-items:center;font-size:.62rem;font-weight:700;text-align:center;padding:2px;line-height:1.1;background:var(--surface)}
.preview.ap .m{border-style:dashed}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:48px;height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1.4rem;font-weight:600}
.stepper input{width:72px;text-align:center;min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:1.2rem;font-weight:600}
.confirm{border:1px solid var(--danger);border-radius:12px;padding:12px;display:grid;gap:10px;background:var(--surface)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:40;max-width:calc(100% - 32px)}
.datalist-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.datalist-chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.85rem}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}

<script>
const FUNKTIONEN = [
  {k:"aus",      l:"Aus-/Wechselschalter", e:"Wechselschalter-Einsatz",   a:"Wippe", kurz:"AUS/W"},
  {k:"kreuz",    l:"Kreuzschalter",        e:"Kreuzschalter-Einsatz",     a:"Wippe", kurz:"KREUZ"},
  {k:"serie",    l:"Serienschalter",       e:"Serienschalter-Einsatz",    a:"Serienwippe", kurz:"SERIE"},
  {k:"kontroll", l:"Kontrollschalter",     e:"Kontrollschalter-Einsatz",  a:"Wippe mit Kontrollfenster", kurz:"KONTR"},
  {k:"taster",   l:"Taster",               e:"Taster-Einsatz (Schließer)",a:"Wippe", kurz:"TAST"},
  {k:"sertast",  l:"Serientaster",         e:"Serientaster-Einsatz",      a:"Serienwippe", kurz:"S-TAST"},
  {k:"jalousie", l:"Jalousietaster",       e:"Jalousietaster-Einsatz",    a:"Jalousiewippe", kurz:"JAL"},
  {k:"dimmer",   l:"Dimmer",               e:"Dimmer-Einsatz",            a:"Dimmer-Abdeckung mit Knopf", kurz:"DIMM"},
  {k:"schuko",   l:"SCHUKO-Steckdose",     e:"SCHUKO-Steckdose",          a:null, kurz:"SD"},
  {k:"schukok",  l:"SCHUKO mit Klappdeckel",e:"SCHUKO-Steckdose mit Klappdeckel", a:null, kurz:"SD-K"},
  {k:"schukou",  l:"SCHUKO mit USB",       e:"SCHUKO-Steckdose mit USB",  a:null, kurz:"SD-USB"},
  {k:"usb",      l:"USB-Ladedose",         e:"USB-Ladeeinsatz",           a:"Abdeckung USB", kurz:"USB"},
  {k:"tae",      l:"TAE-Dose",             e:"TAE-Einsatz",               a:"Zentralplatte TAE", kurz:"TAE"},
  {k:"rj45",     l:"Datendose RJ45",       e:"RJ45-Einsatz",              a:"Zentralplatte RJ45", kurz:"RJ45"},
  {k:"antenne",  l:"Antennendose TV/SAT",  e:"Antennendose-Einsatz",      a:"Abdeckung Antennendose", kurz:"TV"},
  {k:"bwm",      l:"Bewegungsmelder",      e:"BWM-Einsatz",               a:"BWM-Aufsatz", kurz:"BWM"},
  {k:"blind",    l:"Blindabdeckung",       e:null,                        a:"Blindabdeckung", kurz:"BLIND"},
];
const FMAP = Object.fromEntries(FUNKTIONEN.map(f=>[f.k,f]));
const DOSEN = {up:"UP-Gerätedose", hw:"Hohlwanddose", keine:"keine (Bestand)"};
const RAUM_VORSCHLAG = ["Flur","Wohnzimmer","Küche","Bad","WC","Schlafzimmer","Kinderzimmer","Büro","Keller","Treppenhaus","Außen"];

let db=null, user=null, mode="loading", jobs=[], openId=null, tab="pos", toastT=null, pendingDelete=false, suche="", listDelete=null, pendingReset=false;
const saveTimers={};

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const heute=()=>new Date().toISOString().slice(0,10);
const fmtDatum=d=>{if(!d)return"";const [y,m,t]=d.split("-");return `${t}.${m}.${y}`};

function toast(msg){clearTimeout(toastT);let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.textContent=msg;toastT=setTimeout(()=>t.remove(),2400)}

/* ---------- Speicher ---------- */
function lsLoad(){try{return JSON.parse(localStorage.getItem("aufmass_jobs")||"[]")}catch(e){return[]}}
function lsSave(){try{localStorage.setItem("aufmass_jobs",JSON.stringify(jobs))}catch(e){}}

async function init(){
  render();
  const t=setTimeout(()=>{if(mode==="loading"){mode="local";jobs=lsLoad();render()}},10000);
  try{db=await window.claude?.use?.("db")}catch(e){db=null}
  try{user=await window.claude?.use?.("user")}catch(e){user=null}
  if(!db){clearTimeout(t);mode="local";jobs=lsLoad();render();return}
  db.collection("aufmasse").onSnapshot(snap=>{
    clearTimeout(t);mode="db";
    const remote=snap.docs.map(d=>({id:d.id,...structuredClone(d.data())}));
    // eigene, noch ungespeicherte Änderungen behalten
    jobs=remote.map(r=>saveTimers[r.id]?(jobs.find(j=>j.id===r.id)||r):r);
    jobs.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
    if(!document.querySelector(".scrim")&&!document.activeElement?.matches?.("input,textarea,select"))render();
    else if(!openId)render();
  },err=>{clearTimeout(t);mode="local";jobs=lsLoad();render();toast("Server nicht erreichbar – speichere auf diesem Gerät")});
}

function persist(job){
  job.updatedAt=Date.now();
  if(mode!=="db"){lsSave();return}
  clearTimeout(saveTimers[job.id]);
  saveTimers[job.id]=setTimeout(async()=>{
    const data=structuredClone(job);delete data.id;
    try{await db.collection("aufmasse").doc(job.id).set(data)}
    catch(e){toast(e?.code==="invalid_argument"?"Keine Schreibrechte für dieses Aufmaß":"Speichern fehlgeschlagen – bitte erneut versuchen")}
    finally{delete saveTimers[job.id]}
  },700);
}
async function removeJob(id){
  jobs=jobs.filter(j=>j.id!==id);
  if(mode==="db"){try{await db.collection("aufmasse").doc(id).delete()}catch(e){toast("Löschen fehlgeschlagen")}}else lsSave();
}

/* ---------- Berechnung ---------- */
function posTitel(p){
  const n=p.slots.length;
  const namen=p.slots.map(k=>FMAP[k]?.l||"?");
  const gleich=namen.every(x=>x===namen[0]);
  return n===1?namen[0]:(gleich?`${n}× ${namen[0]}`:namen.join(" + "))+` (${n}-fach)`;
}
function material(job){
  const g={rahmen:{},einsatz:{},abdeckung:{},dose:{},sonst:{}};
  const add=(grp,name,q)=>{if(!name||!q)return;g[grp][name]=(g[grp][name]||0)+q};
  for(const p of job.positionen){
    const q=+p.anzahl||0,n=p.slots.length;
    if(p.montage==="AP")add("rahmen",`AP-Gehäuse ${n}-fach`,q);
    else add("rahmen",`Rahmen ${n}-fach`,q);
    for(const k of p.slots){const f=FMAP[k];if(!f)continue;add("einsatz",f.e,q);add("abdeckung",f.a,q)}
    if(p.montage!=="AP"&&p.dose&&p.dose!=="keine")add("dose",DOSEN[p.dose],q*n);
  }
  for(const x of job.extras||[])add("sonst",x.text,+x.anzahl||0);
  return [
    ["Rahmen / AP-Gehäuse",g.rahmen],["Einsätze",g.einsatz],["Wippen / Abdeckungen",g.abdeckung],["Dosen",g.dose],["Sonstiges",g.sonst]
  ].map(([t,o])=>[t,Object.entries(o).sort((a,b)=>a[0].localeCompare(b[0],"de",{numeric:true}))]).filter(([,r])=>r.length);
}
const anzahlStellen=job=>job.positionen.reduce((s,p)=>s+(+p.anzahl||0),0);

/* ---------- Ansicht ---------- */
function statusLine(){
  if(mode==="loading")return `<span class="status">Lade Aufmaße …</span>`;
  if(mode==="db")return "";
  return `<span class="status warn">Nur auf diesem Gerät gespeichert</span>`;
}
function render(){
  const app=$("#app");
  const job=jobs.find(j=>j.id===openId);
  if(!job){openId=null;app.innerHTML=renderList();renderBar();return}
  app.innerHTML=renderJob(job);renderBar(job);
}
function filtered(){
  const q=suche.trim().toLowerCase();if(!q)return jobs;
  return jobs.filter(j=>[j.titel,j.kunde,j.adresse,j.monteur,j.hersteller,j.programm,j.farbe,fmtDatum(j.datum)].join(" ").toLowerCase().includes(q));
}
function renderJobCards(){
  const list=filtered();
  if(!list.length)return `<p class="muted">Kein Aufmaß gefunden für „${esc(suche)}“.</p>`;
  return list.map(j=>`<div class="job">
    <button class="job-open" data-open="${j.id}">
      <span class="t">${esc(j.titel||"Ohne Bezeichnung")}</span>
      <span class="s">${esc([j.kunde,fmtDatum(j.datum),[j.hersteller,j.programm,j.farbe].filter(Boolean).join(" ")].filter(Boolean).join(" · "))}</span>
    </button>
    ${listDelete===j.id
      ?`<div class="job-actions confirm-inline"><b>Endgültig löschen?</b><button class="btn danger small" data-ldelyes="${j.id}">Ja, löschen</button><button class="btn small" data-ldelno="1">Abbrechen</button></div>`
      :`<div class="job-side"><button class="btn small primary" data-lpdf="${j.id}">PDF</button><button class="btn small danger" data-ldel="${j.id}">Löschen</button></div>`}
  </div>`).join("");
}
function renderList(){
  let h=`<div class="topbar"><div><h1>Aufmaß Schaltermaterial</h1></div></div><div style="margin-bottom:12px">${statusLine()}</div>`;
  if(mode==="loading")return h;
  if(jobs.length)h+=`<label class="search"><span class="sr">Suchen</span><input id="suche" data-ac="suche" type="search" placeholder="Suchen: Baustelle, Kunde, Monteur, Datum …" value="${esc(suche)}" autocomplete="off"></label>`;
  if(!jobs.length){
    h+=`<div class="empty"><h2>Noch kein Aufmaß</h2><p class="muted" style="margin:0;max-width:42ch">Lege ein Aufmaß pro Baustelle an. Pro Raum erfasst du jede Schalterkombination – Rahmen, Einsätze, Wippen und Dosen rechnet die App selbst zusammen.</p>
    <div class="row" style="justify-content:center"><button class="btn primary" data-act="new">Neues Aufmaß</button><button class="btn" data-act="demo">Beispiel ansehen</button></div></div>`;
    return h;
  }
  h+=`<div class="list" id="joblist">${renderJobCards()}</div>`;
  h+=sicherungHtml();
  return h;
}
function renderJob(job){
  let h=`<div class="topbar"><button class="btn ghost small" data-act="back" style="padding-left:0">‹ Alle Aufmaße</button>${statusLine()}</div>
  <div class="eyebrow">${esc(fmtDatum(job.datum))}${job.kunde?" · "+esc(job.kunde):""}</div>
  <h1>${esc(job.titel||"Ohne Bezeichnung")}</h1>
  <div class="muted">${esc([job.hersteller,job.programm,job.farbe].filter(Boolean).join(" · ")||"Schalterprogramm noch offen")}</div>
  <div class="tabs" role="tablist">
    ${[["pos","Positionen"],["mat","Materialliste"],["kopf","Kopfdaten"]].map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" data-tab="${k}">${l}</button>`).join("")}
  </div>`;
  if(tab==="kopf")h+=renderKopf(job);
  else if(tab==="mat")h+=renderMat(job);
  else h+=renderPos(job);
  return h;
}
function renderKopf(job){
  const AK={kunde:"kunde",adresse:"adresse",monteur:"monteur",hersteller:"hersteller",programm:"programm",farbe:"farbe",firma:"firma"};
  const f=(k,l,type="text",cls="")=>`<label class="f ${cls}">${l}<input id="k_${k}" data-kopf="${k}" ${AK[k]?`data-ac="${AK[k]}" autocomplete="off"`:""} type="${type}" value="${esc(job[k]||"")}"></label>`;
  return `<div class="fields">
    ${f("titel","Bauvorhaben","text","full")}${f("kunde","Kunde")}${f("adresse","Adresse")}${f("datum","Datum","date")}${f("monteur","Aufgenommen von")}
    ${f("hersteller","Hersteller")}${f("programm","Schalterprogramm")}${f("farbe","Farbe / Material")}${f("firma","Firma (für PDF)")}

/* Bewegung beim Umsortieren: alte Lage merken, neu zeichnen, dann vom alten Ort an den neuen gleiten lassen */
const ruhig=()=>{try{return matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){return false}};
const flipKey=el=>el.dataset.k?el.dataset.k:el.dataset.room!==undefined?"r:"+el.dataset.room:"e:"+el.dataset.etage;
function flip(update,map,mark){
  map=map||{};
  const vorher={},innen={};
  document.querySelectorAll("#app [data-room],#app [data-etage]").forEach(el=>{vorher[flipKey(el)]=el.getBoundingClientRect().top});
  document.querySelectorAll("#app [data-k]").forEach(el=>{const sec=el.closest("[data-room]");innen[el.dataset.k]={sec:sec?flipKey(sec):"",off:el.getBoundingClientRect().top-(sec?sec.getBoundingClientRect().top:0)}});
  update();
  const fuer=k=>{for(const [a,b] of Object.entries(map))if(b===k)return a;return k};
  if(!ruhig()){
    const E={duration:340,easing:"cubic-bezier(.2,.8,.25,1)"};
    document.querySelectorAll("#app [data-room],#app [data-etage]").forEach(el=>{
      const k=flipKey(el),alt=vorher[fuer(k)];
      if(alt===undefined){el.animate([{opacity:0,transform:"translateY(10px)"},{opacity:1,transform:"none"}],E);return}
      const dy=alt-el.getBoundingClientRect().top;
      if(Math.abs(dy)>1)el.animate([{transform:`translateY(${dy}px)`},{transform:"none"}],E);
    });
    document.querySelectorAll("#app [data-k]").forEach(el=>{
      const v=innen[el.dataset.k],sec=el.closest("[data-room]"),sk=sec?flipKey(sec):"";
      if(!v){el.animate([{opacity:0,transform:"translateY(8px)"},{opacity:1,transform:"none"}],E);return}
      if(fuer(sk)!==v.sec)return;
      const dy=v.off-(el.getBoundingClientRect().top-(sec?sec.getBoundingClientRect().top:0));
      if(Math.abs(dy)>1)el.animate([{transform:`translateY(${dy}px)`},{transform:"none"}],E);
    });
  }
  if(mark){const el=[...document.querySelectorAll("#app [data-room],#app [data-etage],#app [data-k]")].find(e=>flipKey(e)===mark);
    if(el){const r=el.getBoundingClientRect();if(r.top<70||r.bottom>innerHeight-90)el.scrollIntoView({block:"center",behavior:ruhig()?"auto":"smooth"})}}
}
function raumSchieben(job,k,d){
  const L=raumListe(job),EL=etagenListe(job),e=kE(k),i=L.indexOf(k);if(i<0)return;
  const gleich=L.map((x,j)=>[x,j]).filter(([x])=>kE(x)===e).map(([,j])=>j),pos=gleich.indexOf(i);
  const nb=gleich[pos+d];
  if(nb!==undefined){[L[i],L[nb]]=[L[nb],L[i]];job.raeume=L;flip(()=>{persist(job);render()},{},"r:"+k);return}
  const ze=EL[EL.indexOf(e)+d];if(ze===undefined)return;
  const nk=KEY(ze,kName(k));
  if(L.includes(nk)){toast(`„${kR(k)}“ gibt es in ${ze?etName(ze):"Ohne Etage"} schon`);return}
  L.splice(i,1);
  const ziel=L.map((x,j)=>[x,j]).filter(([x])=>kE(x)===ze).map(([,j])=>j);
  const at=ziel.length?(d<0?ziel[ziel.length-1]+1:ziel[0]):L.length;
  L.splice(at,0,nk);
  if(ze&&!(job.etagen||[]).includes(ze))job.etagen=EL.filter(Boolean);
  flip(()=>{
    job.raeume=L;
    for(const p of job.positionen)if(PK(p)===k)p.etage=ze;
    for(const x of job.extras||[])if(XK(x)===k)x.etage=ze;
    persist(job);render();
  },{["r:"+k]:"r:"+nk},"r:"+nk);
  toast(`${kR(k)} → ${ze?etName(ze):"Ohne Etage"}`);
}

function etageSpeichern(job){

  job.raeume=[...new Set(L.map(k=>kE(k)===etAlt?KEY(neu,kName(k)):k))];
  for(const p of job.positionen)if((p.etage||"")===etAlt)p.etage=neu;
  for(const x of job.extras||[])if((x.etage||"")===etAlt)x.etage=neu;

function etageLoeschen(job){
  job.raeume=raumListe(job).filter(k=>kE(k)!==etAlt);

  job.positionen=job.positionen.filter(p=>(p.etage||"")!==etAlt);
  job.extras=(job.extras||[]).filter(x=>!(x.raum&&(x.etage||"")===etAlt));
  persist(job);toast("Etage gelöscht");closeLayer();
}

/* Ankreuzfelder im PDF, Kästchen rechts.
   Chrome/Edge zeichnen ein angekreuztes Feld nach dem Antippen selbst neu (Haken mittig im Feld) und färben anklickbare Felder blau.
   Darum: kleines Ankreuzfeld nur auf dem Kästchen; die gelbe Zeile ist ein eigenes, schreibgeschütztes, anfangs verstecktes Feld darunter,
   das ein kleines Skript am Ankreuzfeld ein- und ausblendet. */
function markierFelder(doc,zellen,BOX){
  const k=72/25.4,f=n=>n.toFixed(2),fs=9;
  const fid=doc.getFont("helvetica","normal").id;
  const pe=s=>String(s).replace(/[\\()]/g,"\\$&");
  const xo=(fo,stream,W,H)=>{const x=doc.AcroFormAppearance.CheckBox.OffPushDown(fo);x.BBox=[0,0,+f(W),+f(H)];x.stream=stream||" ";return x};
  const fest=(o,key,val)=>Object.defineProperty(o,key,{value:val,configurable:false,enumerable:true,writable:true});
  zellen.forEach((z,i)=>{
    if(!z||z.c.length<3)return;
    const [c0,c1,c2]=z.c,W=(c0.w+c1.w+c2.w)*k,H=c0.h*k;
    const x1=c0.w*k,x2=(c0.w+c1.w)*k,b=BOX*k,bx=x2+(c2.w*k-b)/2,by=(H-b)/2,ty=H/2-fs*0.35;
    doc.setFont("helvetica","normal");doc.setFontSize(fs);
    const tw=doc.getTextWidth(c1.t)*k;
    // gelbe Zeile: Hintergrund, Gitterlinien, Kästchenrahmen und der Zeilentext neu gezeichnet
    const gelb=["q","1 0.969 0.6 rg",`0 0 ${f(W)} ${f(H)} re f`,
      "0.72 G 0.4 w",`0.2 0.2 ${f(W-0.4)} ${f(H-0.4)} re S`,`${f(x1)} 0 m ${f(x1)} ${f(H)} l S`,`${f(x2)} 0 m ${f(x2)} ${f(H)} l S`,
      "0 G 0.85 w",`${f(bx)} ${f(by)} ${f(b)} ${f(b)} re S`,
      "0.086 0.125 0.173 rg",
      "BT",`/${fid} ${fs} Tf`,`${f(c0.pl*k)} ${f(ty)} Td`,`(${pe(c0.t)}) Tj`,"ET",
      "BT",`/${fid} ${fs} Tf`,`${f(x2-c1.pr*k-tw)} ${f(ty)} Td`,`(${pe(c1.t)}) Tj`,"ET","Q"].join("\n");
    doc.setPage(z.seite);
    const hl=new doc.AcroFormCheckBox();
    hl.fieldName="zeile_"+i;hl.x=c0.x;hl.y=c0.y;hl.width=c0.w+c1.w+c2.w;hl.height=c0.h;
    hl.appearanceStreamContent={N:{On:fo=>xo(fo,gelb,W,H),Off:fo=>xo(fo," ",W,H)}};
    hl.appearanceState="On";hl.value="On";hl.readOnly=true;hl.F=6; // versteckt, bis angekreuzt wird
    doc.addField(hl);
    // Ankreuzfeld: nur das Kästchen
    const S=BOX,w=S*k;
    const haken=["q","0 G 1.4 w",`${f(w*.18)} ${f(w*.5)} m ${f(w*.42)} ${f(w*.2)} l ${f(w*.85)} ${f(w*.85)} l S`,"Q"].join("\n");
    const cb=new doc.AcroFormCheckBox();
    cb.fieldName="warenkorb_"+i;cb.x=c2.x+(c2.w-S)/2;cb.y=c2.y+(c2.h-S)/2;cb.width=S;cb.height=S;
    cb.appearanceStreamContent={N:{On:fo=>xo(fo,haken,w,w),Off:fo=>xo(fo," ",w,w)},D:{On:fo=>xo(fo,haken,w,w),Off:fo=>xo(fo," ",w,w)}};
    cb.appearanceState="Off";cb.value="Off";
    fest(cb,"AA",`<</U <</S /JavaScript /JS (var f=this.getField\\("zeile_${i}"\\);if\\(f\\){f.display=\\(event.target.value=="Off"\\)?display.hidden:display.visible;})>>>>`);
    doc.addField(cb);
  });
}

async function sicherungLaden(file){
  let d;try{d=JSON.parse(await file.text())}catch(e){toast("Die Datei ist keine gültige Datensicherung.");return}
  const liste=Array.isArray(d)?d:(d&&Array.isArray(d.aufmasse)?d.aufmasse:null);
  if(!liste){toast("Die Datei ist keine gültige Datensicherung.");return}
  let neu=0,akt=0;
  for(const a of liste){
    if(!a||!a.id||!Array.isArray(a.positionen))continue;
    const i=jobs.findIndex(j=>j.id===a.id);
    if(i<0){neu++;jobs.push(a)}else if((a.updatedAt||0)>(jobs[i].updatedAt||0)){akt++;jobs[i]=a}else continue;
    if(mode==="db"){const data=structuredClone(a);delete data.id;try{await db.collection("aufmasse").doc(a.id).set(data)}catch(e){toast("Wiederherstellen fehlgeschlagen");return}}
  }
  if(mode!=="db")lsSave();
  jobs.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));render();
  toast(neu||akt?`Daten wiederhergestellt: ${neu} neu, ${akt} aktualisiert`:"Alle Aufmaße der Datensicherung sind schon vorhanden.");
}

farbe:["reinweiß glänzend","reinweiß seidenmatt","reinweiß matt","alpinweiß","polarweiß","cremeweiß glänzend","weiß glänzend","weiß matt","schwarz matt","schwarz glänzend","anthrazit","anthrazit matt","grau","lichtgrau","aluminium","alu lackiert","Edelstahl","Edelstahl lackiert","Edelstahl (Echtmetall)","Edelstahl gebürstet","chrom","chrom matt","Messing","Messing antik","Bronze","Gold","Holz","Glas weiß","Glas schwarz"]};
const PROG_JE={Gira:["E2","E3","Standard 55","System 55","Event","Event Klar","Event Opak","Esprit","Studio","ClassiX","ClassiX Art","Gira Aufputz Feuchtraum"],Jung:["A 500","A 550","A creation","A flow","AS 500","CD 500","LS 990","LS ZERO","LS 1912","LS Plus","WG 800"],"Busch-Jaeger":["Balance SI","Reflex SI","future linear","Busch-axcent","Busch-axcent pur","solo","carat","Busch-dynasty","pure stainless steel","ocean"],Berker:["S.1","B.1","B.3","B.7","Q.1","Q.3","Q.7","R.1","R.3","R.8","K.1","K.5","Serie 1930","Arsys","W.1"],Merten:["M-Smart","M-Plan","M-Pure","M-Elegance","M-Arc","Artec","Antik","System M","AQUASTAR"]};
const nA=t=>String(t||"").toLowerCase().replace(/ß/g,"ss").replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue");
const nB=t=>String(t||"").toLowerCase().replace(/ß/g,"ss").normalize("NFD").replace(/[̀-ͯ]/g,"");
const passt=(x,q)=>nA(x).includes(nA(q))||nB(x).includes(nB(q));
const anfang=(x,q)=>nA(x).startsWith(nA(q))||nB(x).startsWith(nB(q));
function nachHaeufigkeit(arr){const c=new Map();for(const v of arr){const t=String(v||"").trim();if(t)c.set(t,(c.get(t)||0)+1)}return [...c.entries()].sort((a,b)=>b[1]-a[1]).map(e=>e[0])}
function gelernt(typ,inp){
  const J=jobs;
  switch(typ){
    case "raum":return nachHaeufigkeit(J.flatMap(j=>raumListe(j).map(kR)).filter(x=>x!=="Ohne Raum"));
    case "etage":return nachHaeufigkeit(J.flatMap(j=>etagenListe(j).filter(Boolean).map(etName)));
    case "artikel":return nachHaeufigkeit(J.flatMap(j=>(j.extras||[]).map(x=>x.text)));
    case "bemerkung":return nachHaeufigkeit(J.flatMap(j=>j.positionen.map(p=>p.notiz)));
    case "suche":return nachHaeufigkeit(J.flatMap(j=>[j.titel,j.kunde,j.adresse,j.monteur]));
    default:return nachHaeufigkeit(J.map(j=>j[typ]));
  }
}
function vorschlaege(inp){
  const typ=inp.dataset.ac;let L=[...gelernt(typ,inp),...(AC_LISTEN[typ]||[])];
  if(typ==="programm"){const job=jobs.find(j=>j.id===openId),h=(job?.hersteller||"").trim();const k=Object.keys(PROG_JE).find(x=>nA(x)===nA(h));if(k)L=[...gelernt(typ),...PROG_JE[k],...L]}
  if(typ==="raum"||typ==="etage"){/* im offenen Aufmaß schon vorhandene nach hinten */}
  L=[...new Set(L)];
  const q=inp.value.trim();
  if(q){L=L.filter(x=>passt(x,q)&&x!==q);L.sort((a,b)=>(anfang(b,q)?1:0)-(anfang(a,q)?1:0))}
  return L.slice(0,300);
}
let acEl=null,acInp=null,acIdx=-1;
function acZu(){acEl?.remove();acEl=null;acInp=null;acIdx=-1}
function acAuf(inp){
  const L=vorschlaege(inp);
  if(!L.length){acZu();return}
  if(acInp!==inp){acZu();acInp=inp}
  if(!acEl){acEl=document.createElement("div");acEl.className="ac-list";acEl.setAttribute("role","listbox");(inp.closest("label")||inp.parentElement).appendChild(acEl)}
  const q=inp.value.trim();
  const fett=x=>{if(!q)return esc(x);const i=nB(x).indexOf(nB(q));return i<0?esc(x):esc(x.slice(0,i))+"<b>"+esc(x.slice(i,i+q.length))+"</b>"+esc(x.slice(i+q.length))};
  acIdx=-1;
  acEl.innerHTML=L.map((x,i)=>`<button type="button" class="ac-opt" role="option" data-acv="${esc(x)}">${fett(x)}</button>`).join("");
}
function acWaehle(v){
  const inp=acInp;if(!inp)return;
  inp.value=v;acZu();
  inp.dispatchEvent(new Event("input",{bubbles:true}));
  setTimeout(acZu,0);
}
document.addEventListener("focusin",e=>{if(e.target.matches?.("[data-ac]"))acAuf(e.target)});
document.addEventListener("focusout",e=>{if(e.target===acInp)setTimeout(()=>{if(document.activeElement!==acInp)acZu()},180)});
document.addEventListener("input",e=>{if(e.target.matches?.("[data-ac]")&&document.activeElement===e.target)acAuf(e.target)});
document.addEventListener("pointerdown",e=>{if(e.target.closest?.(".ac-list"))e.preventDefault()});
document.addEventListener("click",e=>{const o=e.target.closest?.(".ac-opt");if(o){e.preventDefault();acWaehle(o.dataset.acv)}},true);
document.addEventListener("keydown",e=>{
  if(!acEl||e.target!==acInp)return;
  const opts=[...acEl.querySelectorAll(".ac-opt")];
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();acIdx=(acIdx+(e.key==="ArrowDown"?1:-1)+opts.length)%opts.length;opts.forEach((o,i)=>o.classList.toggle("akt",i===acIdx));opts[acIdx]?.scrollIntoView({block:"nearest"})}
  else if(e.key==="Enter"&&acIdx>=0){e.preventDefault();acWaehle(opts[acIdx].dataset.acv)}
  else if(e.key==="Escape"){acZu()}
});

/* ---------- Ereignisse ---------- */
function newJob(demo){
  const j={id:uid(),titel:demo?"Beispiel: EFH Musterweg 4 (kann gelöscht werden)":"",kunde:demo?"Familie Muster":"",adresse:"",datum:heute(),monteur:"",hersteller:demo?"Gira":"",programm:demo?"E2":"",farbe:demo?"reinweiß glänzend":"",firma:"",notiz:"",positionen:[],extras:[],updatedAt:Date.now()};
  if(demo)j.positionen=[
    {id:uid(),etage:"Erdgeschoss",raum:"Flur",montage:"UP",dose:"up",slots:["aus","aus"],anzahl:2,notiz:"Wechselschaltung"},
    {id:uid(),etage:"Erdgeschoss",raum:"Flur",montage:"UP",dose:"up",slots:["schuko"],anzahl:2,notiz:""},
    {id:uid(),etage:"Erdgeschoss",raum:"Küche",montage:"UP",dose:"up",slots:["schuko","schuko","schuko"],anzahl:2,notiz:"Arbeitsplatte"},
    {id:uid(),etage:"Erdgeschoss",raum:"Küche",montage:"UP",dose:"up",slots:["serie","schuko"],anzahl:1,notiz:"an Tür"},
    {id:uid(),etage:"Erdgeschoss",raum:"Wohnzimmer",montage:"UP",dose:"hw",slots:["dimmer","jalousie","jalousie"],anzahl:1,notiz:""},
    {id:uid(),etage:"Erdgeschoss",raum:"Wohnzimmer",montage:"UP",dose:"hw",slots:["antenne","rj45","schuko","schuko"],anzahl:1,notiz:"TV-Wand"},
    {id:uid(),etage:"Kellergeschoss",raum:"Keller",montage:"AP",dose:"keine",slots:["aus","schukok"],anzahl:1,notiz:"Feuchtraum"},
  ];
  if(demo)j.etagen=["Kellergeschoss","Erdgeschoss"];
  jobs.unshift(j);openId=j.id;tab=demo?"pos":"kopf";pendingDelete=false;persist(j);render();
  if(!demo)setTimeout(()=>$("#k_titel")?.focus(),50);
}
document.addEventListener("click",e=>{
  const L=e.target.closest("[data-lpdf],[data-ldel],[data-ldelyes],[data-ldelno]");
  if(L){
    if(L.dataset.lpdf){const j=jobs.find(x=>x.id===L.dataset.lpdf);if(j)exportPDF(j)}
    else if(L.dataset.ldel){listDelete=L.dataset.ldel}
    else if(L.dataset.ldelyes){removeJob(L.dataset.ldelyes);listDelete=null;toast("Aufmaß gelöscht")}
    else listDelete=null;
    if(!openId)render();return;
  }
  const el=e.target.closest("[data-act],[data-open],[data-tab],[data-mk],[data-edit],[data-xedit],[data-copy],[data-raummove],[data-addin],[data-xaddin],[data-nraum],[data-raumedit],[data-raumin],[data-art],[data-etedit],[data-etmove],[data-netage],[data-montage],[data-dose],[data-fach],[data-slot],[data-step],[data-xstep]");
  if(!el)return;
  const job=jobs.find(j=>j.id===openId);
  if(el.dataset.open){openId=el.dataset.open;tab="pos";pendingDelete=false;render();scrollTo(0,0);return}
  if(el.dataset.tab){tab=el.dataset.tab;pendingDelete=false;render();return}
  if(el.dataset.edit&&job){openEditor(job,job.positionen.find(p=>p.id===el.dataset.edit));return}
  if(el.dataset.mk&&job){const k=el.dataset.mk;job.markiert={...(job.markiert||{})};if(job.markiert[k])delete job.markiert[k];else job.markiert[k]=true;persist(job);render();return}
  if(el.dataset.xedit&&job){openExtra(job,(job.extras||[]).find(x=>x.id===el.dataset.xedit));return}
  if(el.dataset.raumedit&&job){raumDel=false;openRaum(job,el.dataset.raumedit);return}
  if(el.dataset.copy&&job){const o=job.positionen.find(p=>p.id===el.dataset.copy);if(o){openEditor(job,{...structuredClone(o),id:uid()});draft._neu=true;renderEditor(job)}return}
  if(el.dataset.addin!==undefined&&job){openEditor(job,null,el.dataset.addin);return}
  if(el.dataset.xaddin!==undefined&&job){openExtra(job,null,el.dataset.xaddin);return}
  if(el.dataset.nraum!==undefined&&job){raumAnlegen(job,el.dataset.nraum);return}
  if(el.dataset.art&&job){
    if(el.dataset.art==="artikel"&&draft){readEditorInputs();const k=PK(draft);draft=null;openExtra(job,null,k)}
    else if(el.dataset.art==="stelle"&&xdraft){const k=$("#x_raum").value||undefined;xdraft=null;openEditor(job,null,k)}
    return}
  if(el.dataset.raumin!==undefined&&job){openNeuRaum(job,el.dataset.raumin);return}
  if(el.dataset.etedit&&job){etDel=false;openEtage(job,el.dataset.etedit);return}
  if(el.dataset.netage!==undefined&&job){etageAnlegen(job,el.dataset.netage);return}
  if(el.dataset.etmove&&job){const L=etagenListe(job).filter(Boolean),i=L.indexOf(el.dataset.etmove),j=i+ +el.dataset.dir;if(i>=0&&j>=0&&j<L.length){[L[i],L[j]]=[L[j],L[i]];flip(()=>{job.etagen=L;persist(job);render()},{},"e:"+el.dataset.etmove)}return}
  if(el.dataset.raummove&&job){raumSchieben(job,el.dataset.raummove,+el.dataset.dir);return}
  if(draft&&job){
    if(el.dataset.montage){readEditorInputs();draft.montage=el.dataset.montage;renderEditor(job);return}
    if(el.dataset.dose){readEditorInputs();draft.dose=el.dataset.dose;renderEditor(job);return}
    if(el.dataset.fach){readEditorInputs();const n=+el.dataset.fach;while(draft.slots.length<n)draft.slots.push(draft.slots[draft.slots.length-1]||"aus");draft.slots.length=n;draft._active=Math.min(draft._active,n-1);renderEditor(job);return}
    if(el.dataset.slot!==undefined){readEditorInputs();const i=+el.dataset.slot;draft.slots[i]=el.dataset.fn;draft._active=Math.min(i+1,draft.slots.length-1);renderEditor(job);return}
    if(el.dataset.step){const a=$("#e_anz");a.value=Math.max(1,(parseInt(a.value)||1)+ +el.dataset.step);return}
  }
  if(el.dataset.xstep){const a=$("#x_anz");a.value=Math.max(1,(parseInt(a.value)||1)+ +el.dataset.xstep);return}
  const act=el.dataset.act;
  if(act==="close-bg"&&e.target!==el)return;
  switch(act){
    case "sich-save":sicherungSpeichern();break;
    case "sich-load":{const fi=$("#sichFile");if(fi){fi.value="";fi.onchange=()=>{if(fi.files&&fi.files[0])sicherungLaden(fi.files[0])};fi.click()}break}
    case "new":newJob(false);break;
    case "demo":newJob(true);break;
    case "back":openId=null;pendingDelete=false;render();break;
    case "add":if(job)openNeuRaum(job);break;
    case "raum-neu":raumAnlegen(job,$("#n_name").value);break;
    case "close":case "close-bg":closeLayer();break;
    case "pos-save":{readEditorInputs();const d={...draft};delete d._neu;delete d._active;const i=job.positionen.findIndex(p=>p.id===d.id);if(i>=0)job.positionen[i]=d;else job.positionen.push(d);persist(job);toast(draft._neu?"Stelle hinzugefügt":"Stelle geändert");flip(closeLayer,{},"p:"+d.id);break}
    case "pos-del":job.positionen=job.positionen.filter(p=>p.id!==draft.id);persist(job);toast("Stelle gelöscht");closeLayer();break;
    case "extra":openExtra(job);break;
    case "extra-del":job.extras=(job.extras||[]).filter(x=>x.id!==xdraft.id);persist(job);toast("Artikel gelöscht");closeLayer();break;
    case "raum-save":raumSpeichern(job);break;
    case "etage-add":if(job)openNeuEtage(job);break;
    case "etage-neu":etageAnlegen(job,$("#et_name").value);break;
    case "etage-save":etageSpeichern(job);break;
    case "etage-del":etDel=true;openEtage(job,etAlt);break;
    case "etage-del-no":etDel=false;openEtage(job,etAlt);break;
    case "etage-del-yes":etageLoeschen(job);break;
    case "raum-del":raumDel=true;openRaum(job,raumAlt);break;
    case "raum-del-no":raumDel=false;openRaum(job,raumAlt);break;
    case "raum-del-yes":job.raeume=raumListe(job).filter(r=>r!==raumAlt);job.positionen=job.positionen.filter(p=>PK(p)!==raumAlt);job.extras=(job.extras||[]).filter(x=>XK(x)!==raumAlt);persist(job);toast("Raum gelöscht");closeLayer();break;
    case "extra-save":{const t=$("#x_text").value.trim();if(!t){$("#x_text").focus();return}const rk=$("#x_raum").value;const d={id:xdraft.id,text:t,anzahl:Math.max(1,parseInt($("#x_anz").value)||1),etage:rk?kE(rk):"",raum:rk?kName(rk):""};job.extras=job.extras||[];const i=job.extras.findIndex(x=>x.id===d.id);if(i>=0)job.extras[i]=d;else job.extras.push(d);persist(job);toast(xdraft._neu?"Artikel hinzugefügt":"Artikel geändert");flip(closeLayer,{},"x:"+d.id);break}
    case "del":pendingDelete=true;render();break;
    case "del-no":pendingDelete=false;render();break;
    case "del-yes":removeJob(job.id);openId=null;pendingDelete=false;toast("Aufmaß gelöscht");render();break;
    case "pdf":case "pdf2":exportPDF(job);break;
    case "mk-reset":pendingReset=true;render();break;
    case "mk-reset-no":pendingReset=false;render();break;
    case "mk-reset-yes":job.markiert={};pendingReset=false;persist(job);toast("Markierungen entfernt");render();break;
  }
});
document.addEventListener("input",e=>{
  if(e.target.id==="suche"){suche=e.target.value;listDelete=null;const l=$("#joblist");if(l)l.innerHTML=renderJobCards();return}
  const k=e.target.dataset.kopf;if(!k)return;const job=jobs.find(j=>j.id===openId);if(!job)return;
  job[k]=e.target.value;persist(job);
});
init();
</script>
